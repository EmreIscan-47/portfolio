<section class="hero-background"></section>

<section class="header-shadow"></section>
<section class="t-p-section">
  <app-header></app-header>
  <div>
    <div class="main-wrapper">
      <div>
        <img
          [class.roll-out]="helloWorldHover"
          [class.roll-in]="rollIn"
          src="./assets/img/hero/waving_hand.png"
          alt=""
        />
        <button
          (click)="goTo('about')"
          (mouseenter)="helloWorldHover = true; rollIn = false"
          (mouseleave)="helloWorldHover = false; rollIn = true"
        >
          @if (helloWorldHover) { {{ "hero.welcome.welcome_2" | translate }} }
          @else { {{ "hero.welcome.welcome_1" | translate }} }
        </button>
      </div>

      <div [class.deActive]="isGermanActive" class="frontend-wrapper">
        <div>
          <span
            *ngFor="
              let item of firstWrapper;
              let isFirst = first;
              let i = index
            "
            (mouseenter)="onMouseEnter(i)"
            (mouseleave)="onMouseLeave()"
            [class.firstLetter]="isFirst"
            [class.active]="hoveredIndex === i"
            >{{ item }}</span
          >
        </div>
        <div
          (mouseenter)="laughSmiley = true"
          (mouseleave)="laughSmiley = false"
          class="polaroid"
        >
          <img src="./assets/img/Polaroid-Frame-Mockup copia 1.png" alt="" />
          <span>Emre :@if(laughSmiley) {D} @else {)} </span>
        </div>
      </div>
      <div [class.deActive]="isGermanActive" class="dev-wrapper">
        <div>
          <span
            *ngFor="let item of secondWrapper; let isLast = last; let i = index"
            [class.lastLetter]="isLast"
            >{{ item }}</span
          >
        </div>
      </div>
    </div>
    <div>
      <button [class.deActive]="isGermanActive" (click)="goTo('contact-me')">
        {{ "hero.contact-me" | translate }}
      </button>
    </div>
    <div
      (mouseenter)="laughSmiley = true"
      (mouseleave)="laughSmiley = false"
      class="polaroid-mobile"
    >
      <img src="./assets/img/Polaroid-Frame-Mockup copia 1.png" alt="" />
      <span>Emre :@if(laughSmiley) {D} @else {)}</span>
    </div>
  </div>
</section>

<section class="socials-section">
  <div>
    <button
      (click)="openLink('https://www.linkedin.com/in/emre-is-919740301/')"
    >
      <img src="./assets/img/linked-In.png" alt="" />
    </button>
    <button (click)="openLink('https://github.com/EmreIscan-47')">
      <img src="./assets/img/github.png" alt="" />
    </button>
    <button
      (click)="openLink('https://www.linkedin.com/in/emre-is-919740301/')"
    >
      <img src="./assets/img/mail.png" alt="" />
    </button>
  </div>
</section>

<section class="photo-section"></section>
